server:
  error:
    whitelabel:
      enabled: false

spring:

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  web:
    resources:
      add-mappings: false

  threads:
    virtual:
      enabled: true

  #  data:
  #    redis:
  #      host: ${MICROSERVICE_MEMBER_REDIS_HOST}
  #      port: ${MICROSERVICE_MEMBER_REDIS_PORT}

  kafka:
    #    bootstrap-servers: ${MICROSERVICE_MEMBER_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000
        request.timeout.ms: 30000
        delivery.timeout.ms: 60000
        retry.backoff.ms: 1000
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        retry.backoff.ms: 1000
    listener:
      ack-mode: record

  datasource:
    hikari:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
      username: sa
      password:

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 0
    baseline-on-migrate: true

  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true
        use_sql_comments: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

management:
  endpoints:
    web:
      exposure:
        include:
          - beans
          - health
          - info
          - metrics
          - env
          - configprops

jwt:
  access-token:
    secret-key: accessTokenSecretKey
    valid-duration: 60s
  refresh-token:
    secret-key: refreshTokenSecretKey
    valid-duration: 60m
