dependencies {

    // Internal
    implementation project(":msa-board-common")
    implementation project(":msa-board-support-infra")
    implementation project(":msa-board-support-web")

    // Kafka
    implementation "org.springframework.kafka:spring-kafka"

    // Actuator
    implementation "org.springframework.boot:spring-boot-starter-actuator"

    // Web MVC & Swagger
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui"

    // Security & JWT
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "io.jsonwebtoken:jjwt-api"
    runtimeOnly "io.jsonwebtoken:jjwt-impl"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson"

    // Redis & Redisson
    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation "org.redisson:redisson-spring-boot-starter"

    // Config & Eureka Client
    implementation "org.springframework.cloud:spring-cloud-starter-config"
    implementation "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client"

    // JPA & Flyway & Query DSL
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.flywaydb:flyway-core"
    implementation "org.flywaydb:flyway-mysql"
    implementation "com.querydsl:querydsl-jpa::jakarta"
    annotationProcessor "com.querydsl:querydsl-apt::jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Mapstruct
    implementation "org.mapstruct:mapstruct"
    annotationProcessor "org.mapstruct:mapstruct-processor"

    // MariaDB
    runtimeOnly "org.mariadb.jdbc:mariadb-java-client"

    // Test
    testImplementation project(":msa-board-support-test")
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.kafka:spring-kafka-test"
    testImplementation "it.ozimov:embedded-redis"
    testRuntimeOnly "com.h2database:h2"
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}

test {
    useJUnitPlatform()
}
