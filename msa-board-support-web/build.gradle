configurations {
    testImplementation {
        extendsFrom compileOnly
    }
}

dependencies {

    // Internal
    implementation project(":msa-board-common")

    // WebMvc & WebFlux & Swagger
    compileOnly "org.springframework.boot:spring-boot-starter-web"
    compileOnly "org.springframework.boot:spring-boot-starter-webflux"
    compileOnly "org.springdoc:springdoc-openapi-starter-webmvc-ui"
    compileOnly "org.springdoc:springdoc-openapi-starter-webmvc-ui"

    // Security & JWT
    compileOnly "org.springframework.boot:spring-boot-starter-data-redis"
    compileOnly "io.jsonwebtoken:jjwt-api"

    // Redis & Redis Reactive
    compileOnly "org.springframework.boot:spring-boot-starter-data-redis-reactive"
    compileOnly "org.springframework.boot:spring-boot-starter-security"

    // Test
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "io.projectreactor:reactor-test"
    testImplementation "it.ozimov:embedded-redis"
    testRuntimeOnly "io.jsonwebtoken:jjwt-impl"
    testRuntimeOnly "io.jsonwebtoken:jjwt-jackson"
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

test {
    useJUnitPlatform()
}
