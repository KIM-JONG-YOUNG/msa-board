configurations {
    testImplementation {
        extendsFrom compileOnly
    }
}

dependencies {

    implementation project(":msa-board-common")
    implementation "org.springframework.boot:spring-boot-starter-aop"
    implementation "org.springframework.boot:spring-boot-starter-json"

    compileOnly "org.springframework.boot:spring-boot-starter-data-jpa"
    compileOnly "org.springframework.boot:spring-boot-starter-data-redis"
    compileOnly "org.springframework.boot:spring-boot-starter-data-redis-reactive"
    compileOnly "org.redisson:redisson-spring-boot-starter"
    compileOnly "com.querydsl:querydsl-jpa::jakarta"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "it.ozimov:embedded-redis"
    testRuntimeOnly "com.h2database:h2"
}

bootJar {
    enabled = false
}

jar {
    enabled = false
}

test {
    useJUnitPlatform()
}

